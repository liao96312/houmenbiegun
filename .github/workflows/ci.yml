name: CI

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run smoke tests
        run: python tests_smoke.py
      - name: Check writing library
        run: python scripts/check_writing.py
      - name: Check safety cases
        run: python scripts/check_safety_cases.py
      - name: Check model contract
        run: python scripts/check_model_contract.py
      - name: Check media assets
        run: python scripts/check_media.py
      - name: Check request limits
        run: python scripts/check_limits.py
