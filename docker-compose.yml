services:
  app:
    build: .
    env_file:
      - .env
    environment:
      # 放在 environment 里，优先级高于 .env，避免 .env 里的 HOST/PORT 把容器改回只监听 127.0.0.1
      HOST: 0.0.0.0
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; print(json.load(urllib.request.urlopen('http://127.0.0.1:8000/health'))['ok'])"]
      interval: 30s
      timeout: 5s
      retries: 3
